<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | CodeBox Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css?v=1" />
</head>
<body class="bg-[#0B1120] min-h-screen flex flex-col justify-between p-4">

  <div class="flex-1 flex items-center justify-center">
    <div class="w-full max-w-md bg-[#131C31] border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
      
      <!-- Topo com linha Electric Cyan -->
      <div class="border-b-2 border-[#00E5B0] px-6 py-6 text-center bg-[#0B1120]/60">
        <div class="w-12 h-12 rounded-2xl bg-[#0B1120] border border-[#00E5B0]/40 flex items-center justify-center text-[#00E5B0] mx-auto mb-3 shadow-lg">
          <i data-lucide="box" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">
          Code<span class="text-[#00E5B0]">Box</span>
        </h1>
        <p class="text-xs text-slate-400 mt-1">Acesso Restrito — SaaS Toolbox & Secrets Manager</p>
      </div>

      <!-- Formulário de Login -->
      <form id="form-login" class="p-6 space-y-4">
        <div id="login-error" class="hidden p-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs font-medium"></div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">E-mail Administrativo</label>
          <input type="email" id="login-email" required placeholder="seu-email@dominio.com"
            class="w-full px-3.5 py-2.5 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 outline-none focus:border-[#00E5B0]" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Senha de Acesso</label>
          <input type="password" id="login-password" required placeholder="••••••••••••"
            class="w-full px-3.5 py-2.5 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 outline-none focus:border-[#00E5B0]" />
        </div>

        <!-- Aceite obrigatório Termos e LGPD -->
        <div class="pt-1">
          <label class="flex items-start gap-2.5 cursor-pointer">
            <input type="checkbox" id="check-lgpd" required class="mt-0.5 rounded border-slate-600 bg-[#0B1120] text-[#00E5B0] focus:ring-0" />
            <span class="text-[11px] text-slate-400 leading-relaxed">
              Declaro ciência das diretrizes de segurança e concordo com os
              <a href="privacidade.html" target="_blank" class="text-[#00E5B0] underline hover:text-white">Termos de Uso e Política de Privacidade (LGPD)</a>.
            </span>
          </label>
        </div>

        <button type="submit" id="btn-login" class="w-full btn-cta-cyan py-3 rounded-xl text-sm flex items-center justify-center gap-2 mt-2 shadow-lg">
          <i data-lucide="shield-check" class="w-4 h-4"></i>
          <span>Entrar no Ambiente</span>
        </button>

        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-slate-700/80"></div>
          <span class="flex-shrink mx-3 text-[10px] uppercase tracking-wider text-slate-500 font-bold">ou</span>
          <div class="flex-grow border-t border-slate-700/80"></div>
        </div>

        <button type="button" id="btn-google-login" class="w-full py-2.5 px-4 rounded-xl bg-[#0B1120] hover:bg-slate-900 border border-slate-700 text-slate-200 text-xs font-semibold flex items-center justify-center gap-2 transition">
          <i data-lucide="chrome" class="w-4 h-4 text-[#00E5B0]"></i>
          <span>Continuar com Conta Google Autorizada</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Rodapé Institucional -->
  <footer class="text-center py-4 text-xs text-slate-500">
    <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" rel="noopener noreferrer" class="hover:text-[#00E5B0] transition">
      Powered by CS Code Solutions
    </a>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=1"></script>
  <script>
    lucide.createIcons();

    const formLogin = document.getElementById("form-login");
    const errorBox = document.getElementById("login-error");

    function mostrarErro(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove("hidden");
    }

    function validarProprietario(user) {
      if (!user || user.email !== OWNER_EMAIL) {
        auth.signOut();
        mostrarErro("Acesso negado: este ambiente é de uso exclusivo do administrador autorizado.");
        return false;
      }
      window.location.href = "index.html";
      return true;
    }

    auth.onAuthStateChanged((user) => {
      if (user && user.email === OWNER_EMAIL) {
        window.location.href = "index.html";
      }
    });

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");
      const email = document.getElementById("login-email").value.trim();
      const senha = document.getElementById("login-password").value;

      if (email !== OWNER_EMAIL) {
        return mostrarErro("E-mail não autorizado para acessar o CodeBox.");
      }

      try {
        const cred = await auth.signInWithEmailAndPassword(email, senha);
        validarProprietario(cred.user);
      } catch (err) {
        mostrarErro("Falha na autenticação. Verifique suas credenciais.");
      }
    });

    document.getElementById("btn-google-login").addEventListener("click", async () => {
      errorBox.classList.add("hidden");
      if (!document.getElementById("check-lgpd").checked) {
        return mostrarErro("Aceite os Termos de Uso e Política de Privacidade antes de prosseguir.");
      }
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const cred = await auth.signInWithPopup(provider);
        validarProprietario(cred.user);
      } catch (err) {
        mostrarErro("Não foi possível autenticar com o Google.");
      }
    });
  </script>
</body>
</html>
