<div class="space-y-6">

  <!-- Cabeçalho -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Cofre de Secrets & Credenciais</h1>
      <p class="text-xs sm:text-sm text-slate-500">Client Secrets (Azure), tokens de API e senhas protegidos com AES-256-GCM e alerta de expiração.</p>
    </div>
    <button onclick="CofreModule.abrirModalSegredo()" class="btn-cta-cyan px-4 py-2.5 rounded-xl text-xs flex items-center gap-2 self-start sm:self-auto shadow-xs">
      <i data-lucide="plus" class="w-4 h-4"></i>
      <span>+ Cadastrar Secret</span>
    </button>
  </div>

  <!-- Banner de Status AES-256 -->
  <div id="banner-cofre-status" class="rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border">
    <!-- Atualizado via js/cofre.js -->
  </div>

  <!-- Filtros -->
  <div class="flex flex-col sm:flex-row gap-3">
    <div class="flex-1 bg-white p-3 rounded-xl border border-slate-200 flex items-center gap-2.5 shadow-xs">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 ml-1"></i>
      <input type="text" id="busca-segredos" placeholder="Buscar por nome da chave, projeto ou provedor..."
        class="w-full text-sm bg-transparent outline-none text-slate-800 placeholder-slate-400" />
    </div>
    <select id="filtro-status-segredo" class="px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 outline-none focus:border-blue-600">
      <option value="todos">Todos os Status</option>
      <option value="vencendo">Vencidos ou Próximos (≤45d)</option>
      <option value="ok">Em Dia</option>
    </select>
  </div>

  <!-- Lista de Segredos -->
  <div id="lista-segredos-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Renderizado via js/cofre.js -->
  </div>

</div>

<!-- MODAL: CADASTRAR / RENOVAR SECRET -->
<div id="modal-segredo" class="hidden fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-xs flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full overflow-hidden">
    <div class="bg-[#0B1120] border-b-2 border-[#00E5B0] px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="key-round" class="w-5 h-5 text-[#00E5B0]"></i>
        <h3 id="modal-segredo-titulo" class="text-white font-bold text-base">Cadastrar Secret / Credencial</h3>
      </div>
      <button onclick="CofreModule.fecharModalSegredo()" class="text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <form id="form-segredo" class="p-6 space-y-4">
      <input type="hidden" id="segredo-id" />

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Serviço / Sistema Vinculado *</label>
        <select id="segredo-servico-id" required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600">
          <option value="">Selecione um serviço vinculado...</option>
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Identificador da Chave *</label>
          <input type="text" id="segredo-nome" required placeholder="Ex: Client Secret Entra ID"
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Data de Expiração</label>
          <input type="date" id="segredo-expiracao"
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Valor Secreto (Senha / Token / Secret) *</label>
        <input type="password" id="segredo-valor" placeholder="Será criptografado com AES-256 antes de salvar"
          class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600" />
        <p id="segredo-valor-hint" class="text-[11px] text-slate-400 mt-1">Ao editar/renovar, preencha apenas se quiser substituir o segredo atual.</p>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="CofreModule.fecharModalSegredo()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancelar</button>
        <button type="submit" class="btn-cta-cyan px-5 py-2.5 rounded-xl text-xs">Salvar no Cofre</button>
      </div>
    </form>
  </div>
</div>
